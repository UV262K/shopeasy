name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

env:
  AWS_REGION: ap-southeast-2
  ECR_REPO: shopeasy
  CLUSTER: shopeasy-cluster
  SERVICE: shopeasy-service

jobs:
  test-and-build:
    name: CI - test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract storefront source
        run: |
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("storefront-source.zip") as archive:
              for name in ("app.py", "test_app.py", "static/index.html"):
                  archive.extract(name, ".")
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Build Docker image
        run: docker build -t shopeasy:${{ github.sha }} .

  deploy:
    name: CD - push to ECR and deploy to ECS
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image (tag = commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO:$TAG .
          docker push $REGISTRY/$ECR_REPO:$TAG
      - name: Register new task definition revision
        id: taskdef
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition shopeasy-task \
            --query taskDefinition > td.json
          jq --arg IMG "$REGISTRY/$ECR_REPO:$TAG" \
            '.containerDefinitions[0].image=$IMG
             | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            td.json > td-new.json
          ARN=$(aws ecs register-task-definition --cli-input-json file://td-new.json \
            --query taskDefinition.taskDefinitionArn --output text)
          echo "arn=$ARN" >> $GITHUB_OUTPUT
      - name: Deploy to ECS and wait for stability
        run: |
          aws ecs update-service --cluster $CLUSTER --service $SERVICE \
            --task-definition ${{ steps.taskdef.outputs.arn }} >/dev/null
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
      - name: Verify running application
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name shopeasy \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          curl -sf $URL/health
          curl -sf $URL/
